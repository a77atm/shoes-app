# codemagic.yaml
definitions:
  scripts:
    - &deploy_firestore_indexes
      name: Deploy Firestore indexes
      script: |
        chmod +x scripts/deploy_firestore_indexes.sh
        ./scripts/deploy_firestore_indexes.sh

workflows:
  android-debug:
    name: Android Debug
    max_build_duration: 30
    environment:
      vars:
        FLUTTER_VERSION: "3.22.0"
        FIREBASE_PROJECT_ID: "shoesapp-e64be"
      groups:
        # لازم تعمل group اسمه firebase في Codemagic فيه المتغير FIREBASE_TOKEN
        # (تجيبه من: firebase login:ci)
        - firebase
    scripts:
      - *deploy_firestore_indexes
      - flutter pub get
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com

  android-release:
    name: Android Release
    max_build_duration: 30
    environment:
      vars:
        FLUTTER_VERSION: "3.22.0"
        FIREBASE_PROJECT_ID: "shoesapp-e64be"
      groups:
        - firebase
    scripts:
      - *deploy_firestore_indexes
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com
