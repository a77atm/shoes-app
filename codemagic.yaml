# codemagic.yaml
workflows:
  android-debug:
    name: Android Debug
    max_build_duration: 30
    environment:
      vars:
        FLUTTER_VERSION: "3.22.0"
    scripts:
      - flutter pub get
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com

  android-release:
    name: Android Release
    max_build_duration: 30
    environment:
      vars:
        FLUTTER_VERSION: "3.22.0"
    scripts:
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com