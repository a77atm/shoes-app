name: Deploy Firestore Indexes

# ينشر firestore.indexes.json تلقائيًا على مشروع shoesapp-e64be
# كل ما الملف يتغير على main — عشان محدش يضيف فلتر جديد وينسى ينشر الـ index.
on:
  push:
    branches: [main, master]
    paths:
      - "firestore.indexes.json"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore-indexes.yml"
  workflow_dispatch:

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: shoesapp-e64be
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate firestore.indexes.json
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore indexes
        run: |
          chmod +x scripts/deploy_firestore_indexes.sh
          ./scripts/deploy_firestore_indexes.sh
